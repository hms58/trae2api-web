name: Build and Release Executables

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.22'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server-linux-amd64
            cmd: ./cmd/server
            os: linux
            arch: amd64
            suffix: server
            ext: ""
          - name: server-linux-arm64
            cmd: ./cmd/server
            os: linux
            arch: arm64
            suffix: server
            ext: ""
          - name: server-windows-amd64
            cmd: ./cmd/server
            os: windows
            arch: amd64
            suffix: server
            ext: ".exe"

          - name: credit-linux-amd64
            cmd: ./cmd/credit
            os: linux
            arch: amd64
            suffix: credit
            ext: ""
          - name: credit-linux-arm64
            cmd: ./cmd/credit
            os: linux
            arch: arm64
            suffix: credit
            ext: ""
          - name: credit-windows-amd64
            cmd: ./cmd/credit
            os: windows
            arch: amd64
            suffix: credit
            ext: ".exe"

          - name: signin-linux-amd64
            cmd: ./cmd/signin
            os: linux
            arch: amd64
            suffix: signin
            ext: ""
          - name: signin-linux-arm64
            cmd: ./cmd/signin
            os: linux
            arch: arm64
            suffix: signin
            ext: ""
          - name: signin-windows-amd64
            cmd: ./cmd/signin
            os: windows
            arch: amd64
            suffix: signin
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        id: build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          mkdir -p dist
          filename="trae2api-web-${{ matrix.suffix }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build -o "dist/${filename}" "${{ matrix.cmd }}"
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"

      - name: Compress binary
        id: compress
        shell: bash
        run: |
          cd dist
          filename="${{ steps.build.outputs.filename }}"
          archive="${filename}.tar.gz"
          tar -czf "${archive}" "${filename}"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          rm "${filename}"

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.compress.outputs.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ steps.compress.outputs.archive }}
          retention-days: 7
