services:
  tw2api:
    image: ghcr.io/qy743160985-spec/trae2api-web:latest
    container_name: trae2api-web
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - TW2A_API_KEY=${TW2A_API_KEY:?set TW2A_API_KEY in .env or shell}
    ports:
      - "7864:7864"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
